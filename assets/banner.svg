<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .pulse-dot { animation: pulse 2.4s infinite ease-in-out; }
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 4.5px; }
        50% { opacity: 0.45; r: 6px; }
      }
      .float-orb { animation: drift 8s infinite ease-in-out; }
      @keyframes drift {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(18px, -10px); }
      }
    </style>
  </defs>

  <rect width="920" height="220" rx="18" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <g class="float-orb">
    <circle cx="190" cy="65" r="210" fill="url(#glow1)"/>
    <circle cx="740" cy="155" r="220" fill="url(#glow2)"/>
  </g>

  <!-- Status Pill -->
  <rect x="44" y="36" width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)"/>
  <circle cx="62" cy="50" r="4.5" fill="#38bdf8" class="pulse-dot"/>
  <text x="76" y="54" fill="#bae6fd" font-size="11.5" font-weight="600" letter-spacing="0.5" class="font-mono">Marseille, FR · Native &amp; Web</text>

  <!-- Main Name & Handle -->
  <text x="44" y="114" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.8" class="font-main">Mokhtar C</text>
  <text x="242" y="114" fill="url(#accent)" font-size="24" font-weight="600" class="font-mono">@xVegetax</text>

  <!-- Subtitle -->
  <text x="44" y="150" fill="#94a3b8" font-size="15.5" font-weight="400" class="font-main">
    Building native desktop tools, iOS Liquid Glass tweaks, and high-craft interfaces.
  </text>

  <!-- Bottom Tech Strip -->
  <text x="44" y="186" fill="#64748b" font-size="12.5" font-weight="600" letter-spacing="0.8" class="font-mono">
    RUST  ·  TAURI V2  ·  TYPESCRIPT  ·  C++  ·  OBJECTIVE-C  ·  LUA
  </text>
</svg>